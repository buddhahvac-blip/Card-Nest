name: Dependency vulnerability triage
on:
  push:
    branches: [security/npm-audit-triage]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Generate complete and production-only audit reports
        shell: bash
        run: |
          npm audit --json > npm-audit-all.json || true
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e 'for(const kind of ["all","production"]){const data=require("./npm-audit-"+kind+".json"); console.log(kind,JSON.stringify(data.metadata?.vulnerabilities||{})); for(const [name,v] of Object.entries(data.vulnerabilities||{})){console.log(name,v.severity,"fixAvailable:",JSON.stringify(v.fixAvailable),"via:",JSON.stringify(v.via.filter(x=>typeof x==="object").map(x=>({title:x.title,url:x.url,range:x.range}))))}}'
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-reports
          path: npm-audit-*.json
          retention-days: 7
