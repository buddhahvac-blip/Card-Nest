name: Nestling current-art cutout review

on:
  push:
    branches: [feature/raid-inspired-dungeon-upgrade]
    paths: [.github/workflows/publish-nestling-preview.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install extraction tools
        run: pip install "rembg[cpu]==2.0.67" "Pillow>=10,<12"
      - name: Extract candidate from CURRENT master art, never archived card sheet
        run: |
          python - <<'PY'
          import json,urllib.request
          from pathlib import Path
          from PIL import Image
          from rembg import remove,new_session
          from io import BytesIO
          master=json.loads(Path('data/common-master-art.json').read_text())
          url=master['sproutling-001']
          assert url.startswith('https://cdn.openart.ai/'), 'Unexpected canonical art host'
          request=urllib.request.Request(url,headers={'User-Agent':'NestRune-art-review/1.0'})
          with urllib.request.urlopen(request,timeout=45) as r:
           data=r.read(12_000_001)
          if len(data)>12_000_000: raise RuntimeError('Source image exceeds size limit')
          image=Image.open(BytesIO(data)).convert('RGBA')
          if min(image.size)<300: raise RuntimeError('Canonical artwork too small')
          out=Path('review-assets');out.mkdir(exist_ok=True)
          image.save(out/'nestling-current-master-source.png',optimize=True)
          cutout=remove(image,session=new_session('u2net'))
          alpha=cutout.getchannel('A')
          if alpha.getextrema()!=(0,255):raise RuntimeError('No transparent and opaque pixels found')
          box=alpha.getbbox()
          if not box:raise RuntimeError('Empty foreground')
          l,t,r,b=box
          margin=max(12,int(max(r-l,b-t)*.06))
          result=cutout.crop((max(0,l-margin),max(0,t-margin),min(image.width,r+margin),min(image.height,b+margin)))
          result.save(out/'nestling-current-master-cutout-CANDIDATE.png',optimize=True)
          print('Source size',image.size,'candidate size',result.size)
          PY
      - name: Upload source and candidate for HUMAN review only
        uses: actions/upload-artifact@v4
        with:
          name: nestling-current-master-review-only
          path: review-assets/*.png
          retention-days: 14
