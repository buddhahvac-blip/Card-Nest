name: Refresh release-gate lockfile
on:
  workflow_dispatch:
  push:
    branches: [maintenance/release-safety-gate-2026-10-07]
    paths: [.github/workflows/refresh-release-gate-lock.yml]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/release-safety-gate-2026-10-07
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Commit validated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update lockfile for Playwright release gate"
          git push origin HEAD:maintenance/release-safety-gate-2026-10-07
