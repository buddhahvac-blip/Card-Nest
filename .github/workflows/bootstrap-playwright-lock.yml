name: Bootstrap Playwright Lockfile

on:
  push:
    branches:
      - maintenance/reliability-gates-2026-10-06-2100

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/reliability-gates-2026-10-06-2100
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add Playwright to lockfile
        run: npm install --package-lock-only --ignore-scripts --save-dev --save-exact @playwright/test@1.63.0
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Lock Playwright browser test dependency"
          git push origin HEAD:maintenance/reliability-gates-2026-10-06-2100
