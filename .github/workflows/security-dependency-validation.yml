name: Security dependency validation

on:
  push:
    branches:
      - maintenance/security-audit-2026-10-06
    paths:
      - package.json
      - .github/workflows/security-dependency-validation.yml

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/security-audit-2026-10-06
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile without lifecycle scripts
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix --package-lock-only --ignore-scripts || true

      - name: Clean install from generated lockfile
        run: npm ci

      - name: Block high and critical production vulnerabilities
        run: npm audit --omit=dev --audit-level=high

      - name: Run NestRune build and quality gates
        run: npm run build

      - name: Commit validated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Update dependency lockfile for security fixes"
          git push origin HEAD:maintenance/security-audit-2026-10-06
